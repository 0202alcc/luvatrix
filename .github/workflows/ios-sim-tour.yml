name: iOS Simulator Tour

# Runs on a self-hosted Mac. The repository is public, so this workflow never
# triggers on pull_request: only pushes (which need write access) and manual
# dispatches can run code on that machine.
on:
  push:
    branches: ["feature/**", "dev-alec/**"]
    # Desktop branches get the macOS Desktop Run workflow instead; booting the
    # iOS Simulator for them wastes the shared Mac runner for ~15 minutes.
    branches-ignore: ["feature/nomic-desktop-*", "dev-alec/desktop-*"]
  workflow_dispatch:
    inputs:
      app_dir:
        description: App folder to tour
        default: examples/nomic_ios
      tour:
        description: Tour JSON file (default <app_dir>/tour.json)
        default: ""
      simulator:
        description: Simulator device name
        default: iPhone 17

permissions:
  contents: read

concurrency:
  group: ios-sim-tour
  cancel-in-progress: false

jobs:
  tour:
    name: Tour ${{ inputs.app_dir || 'examples/nomic_ios' }} in iOS Simulator
    if: ${{ vars.LUVATRIX_IOS_SIM_RUNNER == '1' }}
    runs-on: [self-hosted, macOS, ios-sim]
    timeout-minutes: 45
    env:
      # Pushes tour only the Nomic iOS app; dispatches tour the chosen app_dir.
      APP_DIR: ${{ inputs.app_dir || 'examples/nomic_ios' }}
      TOUR: ${{ inputs.tour }}
      SIMULATOR: ${{ inputs.simulator || 'iPhone 17' }}
      # Set the LUVATRIX_IOS_KEEP_OPEN repo variable to the toured app folder
      # (e.g. examples/nomic_ios) or its short slug (nomic_ios) to leave that
      # app running and interactive in the simulator after its tour.
      KEEP_OPEN_VAR: ${{ vars.LUVATRIX_IOS_KEEP_OPEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve app
        id: app
        run: |
          slug="$(basename "$APP_DIR")"
          keep_open=""
          if [ -n "$KEEP_OPEN_VAR" ] && { [ "$KEEP_OPEN_VAR" = "$APP_DIR" ] || [ "$KEEP_OPEN_VAR" = "$slug" ]; }; then
            keep_open="1"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "keep_open=$keep_open" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Check Xcode toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          xcrun simctl list devices available | grep -F -- "$SIMULATOR"

      - name: Sync deps
        run: uv sync --frozen

      - name: Prepare embedded iOS Python
        working-directory: ${{ env.APP_DIR }}
        run: uv run bash ios/scripts/setup_ios.sh

      - name: Run tour
        env:
          KEEP_OPEN: ${{ steps.app.outputs.keep_open }}
        run: |
          keep_open_args=()
          if [ -n "$KEEP_OPEN" ]; then
            keep_open_args=(--keep-open)
          fi
          caffeinate -dims uv run python main.py figma ios-tour "$APP_DIR" \
            --tour "${TOUR:-$APP_DIR/tour.json}" \
            --out "$RUNNER_TEMP/ios-tour" \
            --simulator "$SIMULATOR" \
            --native-project "$APP_DIR/ios" \
            "${keep_open_args[@]}"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-tour-${{ steps.app.outputs.slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-tour
          if-no-files-found: warn
          retention-days: 14
