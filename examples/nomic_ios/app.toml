app_id = "app.nomic_ios"
protocol_version = "3"
entrypoint = "app_main:create"
platform_support = ["ios"]
required_capabilities = ["window.write"]
optional_capabilities = ["hdi.touch", "hdi.mouse", "hdi.trackpad"]

[display]
native_width = 402
native_height = 874
bar_color_rgba = [255, 255, 255, 255]
default_coordinate_frame = "screen_tl"
title = "Nomic"

[render]
preferred = "matrix"
fallbacks = ["matrix"]
