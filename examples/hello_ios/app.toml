app_id = "examples.hello_ios"
protocol_version = "3"
entrypoint = "app_main:create"
platform_support = ["ios"]
required_capabilities = ["window.write"]
optional_capabilities = ["hdi.touch"]

[display]
native_width = 393
native_height = 852
bar_color_rgba = [0, 0, 0, 255]
default_coordinate_frame = "screen_tl"
title = "Hello iOS"

[render]
preferred = "auto"
fallbacks = ["scene", "ui", "matrix"]
