app_id = "examples.container_motion"
protocol_version = "3"
entrypoint = "app_main:create"
required_capabilities = ["window.write"]
optional_capabilities = [
  "hdi.keyboard",
  "hdi.mouse",
  "hdi.trackpad",
]

[display]
native_width = 320
native_height = 180
bar_color_rgba = [0, 0, 0, 255]
default_coordinate_frame = "screen_tl"
title = "Container Motion Demo"
icon = "assets/icon.svg"

[render]
preferred = "auto"
fallbacks = ["ui", "matrix"]
