app_id = "examples.static_motion"
protocol_version = "3"
entrypoint = "app_main:create"
required_capabilities = ["window.write"]

[display]
native_width = 320
native_height = 180
bar_color_rgba = [0, 0, 0, 255]
default_coordinate_frame = "screen_tl"
title = "Static Motion Demo"
icon = "assets/icon.svg"

[web]
static_container = "container.json"
