app_id = "examples.spotify_light"
protocol_version = "3"
entrypoint = "app_main:create"
platform_support = ["macos"]
required_capabilities = ["window.write"]
optional_capabilities = ["hdi.keyboard", "hdi.mouse", "hdi.trackpad"]

[display]
native_width = 1280
native_height = 800
bar_color_rgba = [18, 18, 18, 255]
default_coordinate_frame = "screen_tl"
title = "Spotify Light"

[render]
preferred = "scene"
fallbacks = ["scene", "matrix"]

[mcp]
enabled = true
