app_id = "figma.nomic_desktop"
protocol_version = "3"
entrypoint = "app_main:create"
platform_support = ["ios", "macos"]
required_capabilities = ["window.write"]
optional_capabilities = ["hdi.touch", "hdi.mouse", "hdi.trackpad"]

[display]
# Design canvas matches the Figma Flow Screens frames; the window opens at
# exactly this size on macOS.
native_width = 1440
native_height = 900
bar_color_rgba = [0, 0, 0, 255]
default_coordinate_frame = "screen_tl"
title = "Nomic"
# Curated Nomic mark (the logo tile from the design); the macOS runtime sets
# it as the Dock icon via NSApplication.setApplicationIconImage.
icon = "icon.png"

[render]
preferred = "matrix"
fallbacks = ["matrix"]

[mcp]
# Second MCP gate (the first is run-app --mcp, which the macOS Desktop Run
# workflow passes). Serves agent inspection/control on 127.0.0.1 with a
# bearer token; session discovery at .luvatrix/mcp-session.json. Default
# allows all four capability families (inspect, input, control, app).
enabled = true
